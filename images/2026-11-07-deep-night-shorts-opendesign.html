<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Deep Night 깊은 밤 — Open Design</title>
<!-- Open Design(nexu-io/open-design)의 poster-hero 스킬 + neon 디자인 시스템으로 다시 만든 판.
     스킬 규칙: 1080x1920, 메시 배경, 상단 30% 기하 도형, 중앙 대형 제목, 하단 요점 카드, 우하단 브랜드/QR 자리.
     디자인 시스템 규칙: tokens.css 를 첫 :root 에 그대로 붙이고, 원색 hex 는 :root 밖에서 쓰지 않는다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Inter:wght@500;600;800&display=swap">
<style>
/* design-systems/neon/tokens.css (발췌 그대로) */
:root {
  --bg: #070711;
  --surface: #111126;
  --surface-warm: #1e1540;
  --fg: #f8f7ff;
  --fg-2: #d6ccff;
  --muted: #9d8ad4;
  --meta: #c084fc;
  --border: #34265e;
  --border-soft: #241c42;
  --accent: #c084fc;
  --accent-on: #13051f;
  --success: #39ff88;
  --warn: #fff34d;
  --danger: #ff4d8d;
  --font-display: Inter, system-ui, sans-serif;
  --font-body: Inter, system-ui, sans-serif;
  --text-sm: 14px;
  --text-lg: 18px;
  --text-xl: 24px;
  --text-2xl: 36px;
  --text-3xl: 54px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 9999px;
  --elev-raised: 0 24px 80px rgba(192, 132, 252, 0.22);
}
/* 포스터 전용 확장: 영문 헤드라인은 Anton, 한글은 Black Han Sans (원본 디자인의 서체 유지) */
:root {
  --font-headline: 'Anton', var(--font-display);
  --font-hangul: 'Black Han Sans', var(--font-display);
  --glow: 0 0 24px rgba(192, 132, 252, 0.75), 0 0 64px rgba(192, 132, 252, 0.45);
  --glow-text: 0 0 18px rgba(192, 132, 252, 0.8), 0 0 48px rgba(192, 132, 252, 0.5);
  --window: rgba(255, 243, 77, 0.55);
}

body { margin: 0; background: var(--bg); font-family: var(--font-body); color: var(--fg); }
.poster {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 40% at 82% 12%, rgba(192, 132, 252, 0.28), transparent 70%),
    radial-gradient(ellipse 80% 45% at 10% 78%, rgba(255, 77, 141, 0.16), transparent 70%),
    linear-gradient(180deg, var(--bg) 0%, var(--surface) 55%, var(--surface-warm) 100%);
  display: flex; flex-direction: column; padding: 96px 80px 80px; box-sizing: border-box;
}
.grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.14;
  background-image: radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 3px 3px; }
.label { font-size: var(--text-xl); font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }

.top { position: relative; height: 520px; }
.moon { position: absolute; right: 20px; top: 40px; width: 320px; height: 320px; }
.city { position: absolute; left: 0; right: 0; bottom: 0; width: 1080px; height: 760px; }

.headline { position: relative; text-align: center; margin-top: 40px; }
h1 { margin: 0; font-family: var(--font-headline); font-weight: 400; font-size: 200px; line-height: 0.95;
  letter-spacing: 4px; color: var(--fg); text-shadow: var(--glow-text); }
.bar { width: 280px; height: 8px; margin: 36px auto; border-radius: var(--radius-pill); background: var(--accent); box-shadow: var(--glow); }
.hangul { margin: 0; font-family: var(--font-hangul); font-size: 120px; line-height: 1.1; letter-spacing: 28px; color: var(--fg-2); }
.sub { margin: 36px 0 0; font-size: var(--text-2xl); font-weight: 500; letter-spacing: 0.3em; color: var(--muted); }

.card { position: relative; margin-top: auto; padding: var(--space-8) 40px; border-radius: var(--radius-lg);
  background: rgba(17, 17, 38, 0.72); border: 1px solid var(--border); box-shadow: var(--elev-raised);
  backdrop-filter: blur(12px); display: grid; gap: 28px; }
.point { display: flex; align-items: center; gap: var(--space-6); }
.ic { width: 72px; height: 72px; border-radius: var(--radius-md); flex-shrink: 0; display: grid; place-items: center;
  border: 2px solid var(--accent); color: var(--accent); box-shadow: var(--glow); }
.ic svg { width: 36px; height: 36px; }
.k { font-size: var(--text-lg); font-weight: 600; letter-spacing: 0.24em; color: var(--muted); }
.v { font-size: 40px; font-weight: 800; color: var(--fg); margin-top: 4px; }

/* 도시 실루엣 위에 지면 띠를 깔아 브랜드명이 창문 패턴에 묻히지 않게 한다 */
.foot { position: relative; display: flex; align-items: center; justify-content: space-between;
  margin: var(--space-12) -80px -80px; padding: var(--space-8) 80px 80px;
  background: var(--bg); border-top: 6px solid var(--border-soft); }
.brand { font-size: 34px; font-weight: 600; letter-spacing: 0.18em; color: var(--fg-2); }
.qr { width: 140px; height: 140px; border-radius: var(--radius-md); border: 2px dashed var(--border);
  display: grid; place-items: center; text-align: center; font-size: var(--text-lg); line-height: 1.4; color: var(--muted); }
</style>
</head>
<body>
<main class="poster">
  <div class="grain"></div>

  <!-- 하단 도시 실루엣: 원본의 창문 패턴을 neon 의 warn/accent 로 -->
  <svg class="city" aria-hidden="true" viewBox="0 0 1080 760" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="w1" width="34" height="40" patternUnits="userSpaceOnUse"><rect x="9" y="10" width="12" height="16" fill="var(--window)"></rect></pattern>
      <pattern id="w2" width="28" height="34" patternUnits="userSpaceOnUse"><rect x="7" y="8" width="9" height="12" fill="var(--accent)" opacity="0.35"></rect></pattern>
    </defs>
    <g fill="var(--surface-warm)">
      <rect x="0" y="120" width="110" height="640"></rect><rect x="100" y="60" width="92" height="700"></rect>
      <rect x="280" y="40" width="82" height="720"></rect><rect x="718" y="50" width="88" height="710"></rect>
      <rect x="906" y="90" width="82" height="670"></rect><rect x="980" y="160" width="100" height="600"></rect>
    </g>
    <rect x="100" y="60" width="92" height="700" fill="url(#w2)"></rect><rect x="280" y="40" width="82" height="720" fill="url(#w2)"></rect>
    <rect x="718" y="50" width="88" height="710" fill="url(#w2)"></rect><rect x="906" y="90" width="82" height="670" fill="url(#w2)"></rect>
    <g fill="var(--surface)">
      <rect x="0" y="300" width="150" height="460"></rect><rect x="146" y="250" width="126" height="510"></rect>
      <rect x="804" y="240" width="142" height="520"></rect><rect x="940" y="320" width="140" height="440"></rect>
    </g>
    <rect x="146" y="250" width="126" height="510" fill="url(#w1)"></rect><rect x="804" y="240" width="142" height="520" fill="url(#w1)"></rect>
    <rect x="0" y="300" width="150" height="460" fill="url(#w1)" opacity="0.5"></rect><rect x="940" y="320" width="140" height="440" fill="url(#w1)" opacity="0.5"></rect>
    <rect x="207" y="214" width="3" height="36" fill="var(--border)"></rect><circle cx="208.5" cy="210" r="5" fill="var(--danger)"></circle>
    <rect x="874" y="204" width="3" height="36" fill="var(--border)"></rect><circle cx="875.5" cy="200" r="5" fill="var(--danger)"></circle>
  </svg>

  <div class="top">
    <div class="label">K-HIPHOP · SHORTS</div>
    <!-- 상단 30%: 네온 초승달 -->
    <svg class="moon" aria-hidden="true" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="cres"><rect width="320" height="320" fill="#fff"></rect><circle cx="196" cy="136" r="96" fill="#000"></circle></mask>
        <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
      </defs>
      <circle cx="160" cy="160" r="150" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 10"></circle>
      <circle cx="160" cy="160" r="104" fill="var(--accent)" mask="url(#cres)" filter="url(#g)" opacity="0.8"></circle>
      <circle cx="160" cy="160" r="104" fill="var(--fg)" mask="url(#cres)"></circle>
    </svg>
  </div>

  <div class="headline">
    <h1>DEEP NIGHT</h1>
    <div class="bar"></div>
    <p class="hangul">깊은 밤</p>
    <p class="sub">LATE NIGHT BEATS</p>
  </div>

  <section class="card" aria-label="요점">
    <div class="point">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v4"></path></svg></div>
      <div><div class="k">GENRE</div><div class="v">K-HIPHOP</div></div>
    </div>
    <div class="point">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></div>
      <div><div class="k">MOOD</div><div class="v">LATE NIGHT · 깊은 밤</div></div>
    </div>
    <div class="point">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></div>
      <div><div class="k">FORMAT</div><div class="v">9:16 SHORTS</div></div>
    </div>
  </section>

  <footer class="foot">
    <div class="brand">Music Fever Forever</div>
    <div class="qr">[YOUR<br>CHANNEL QR]</div>
  </footer>
</main>
</body>
</html>
