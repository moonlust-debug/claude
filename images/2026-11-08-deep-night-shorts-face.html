<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Deep Night 깊은 밤 — face</title>
<!-- 4번째 판. (흐리고 뿌옇다는 피드백으로 키 비주얼을 안개·그레인 없이 다시 편집하고,
     Real-ESRGAN x2 로 2048x3072 까지 키운 뒤 1280x1920 으로 줄였다(언샤프는 피부 잡티를 키워 뺐다). 덮어 쓰던 그레인과 상단 그라데이션은 뺐다.) ChatGPT 판과 비교해 보니 쇼츠 썸네일은 얼굴 클로즈업과 눈맞춤이 이긴다.
     그래서 키 비주얼만 얼굴 클로즈업(codex exec, 실존 인물과 닮지 않게 요청)으로 바꾸고,
     배경은 테크풍 곡선 대신 보라 안개와 서울 야경 보케, 글자는 처음엔 압축 굵은체였다가 이탤릭 세리프로 바꿨다.
     얼굴이 화면 32% 지점부터 시작하므로 제목은 그 위 하늘에 한 줄로 넣는다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Noto+Serif+KR:wght@400&family=Inter:wght@500;600&display=swap">
<style>
:root {
  --ink: #f6f2ff;
  --lavender: #dccbff;
  --dim: rgba(246, 242, 255, 0.66);
  --night: #0d0614;
}
body { margin: 0; background: var(--night); }
.poster { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--night); color: var(--ink); font-family: 'Inter', sans-serif; }
.kv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
.shade { position: absolute; inset: 0;
  background:
    linear-gradient(0deg, rgba(13,6,20,0.45) 0%, rgba(13,6,20,0) 14%); }

.top { position: absolute; left: 72px; right: 72px; top: 88px; display: flex; justify-content: space-between; align-items: center;
  font-size: 24px; font-weight: 600; letter-spacing: 0.34em; color: var(--dim); }
.top .rule { flex: 1; height: 1px; margin: 0 28px; background: rgba(246,242,255,0.28); }

.title { position: absolute; left: 0; right: 0; top: 200px; text-align: center; }
/* Anton 압축체가 촌스럽다는 피드백으로 교체. 패션 매거진풍 하이콘트라스트 이탤릭 세리프 */
h1 { margin: 0; font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 500; font-size: 190px; line-height: 1; letter-spacing: -4px;
  color: var(--ink); text-shadow: 0 6px 40px rgba(13, 6, 20, 0.6); }
.ko { margin: 34px 0 0; font-family: 'Noto Serif KR', serif; font-weight: 400; font-size: 52px; line-height: 1; letter-spacing: 0.8em;
  padding-left: 0.8em; color: var(--lavender); text-shadow: 0 4px 24px rgba(13, 6, 20, 0.7); }
</style>
</head>
<body>
<main class="poster">
  <img class="kv" src="2026-11-08-deep-night-keyvisual-face.png" alt="보라 네온 빗속 서울 야경을 배경으로 카메라를 내려다보는 래퍼의 얼굴 클로즈업">
  <div class="shade"></div>

  <div class="top"><span>MUSIC FEVER FOREVER</span><span class="rule"></span><span>K-HIPHOP</span></div>

  <div class="title">
    <h1>Deep Night</h1>
    <p class="ko">깊은 밤</p>
  </div>
</main>
</body>
</html>
